hostname R-OSPF-2
no ip domain-lookup
interface Serial2/0
 description Hacia R-OSPF-1
 ip address 10.0.0.2 255.255.255.252
 bandwidth 100000
 ip ospf cost 20
 no shutdown
 exit
interface Serial3/0
 description Hacia R-CENTRAL
 ip address 10.0.0.10 255.255.255.252
 bandwidth 100000
 ip ospf cost 10
 no shutdown
 exit
interface FastEthernet0/0
 description Datos
 ip address 192.168.0.1 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
 exit
router ospf 1
 router-id 2.2.2.2
 passive-interface default
 no passive-interface Serial2/0
 no passive-interface Serial3/0
 maximum-paths 2
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.8 0.0.0.3 area 0
 network 192.168.0.0 0.0.15.255 area 0
 exit
end
