hostname R-OSPF-1
no ip domain-lookup
interface Serial2/0
 description Hacia R-OSPF-2
 ip address 10.0.0.1 255.255.255.252
 bandwidth 100000
 ip ospf cost 20
 clock rate 2000000
 no shutdown
 exit
interface Serial3/0
 description Hacia R-CENTRAL
 ip address 10.0.0.6 255.255.255.252
 bandwidth 100000
 ip ospf cost 10
 no shutdown
 exit
interface FastEthernet0/0
 description Trunk 802.1Q hacia SW-OSPF-1
 no ip address
 no shutdown
 exit
interface FastEthernet0/0.10
 description Datos
 encapsulation dot1Q 10
 ip address 192.168.1.1 255.255.255.192
 bandwidth 100000
 delay 10
 no shutdown
 exit
interface FastEthernet0/0.30
 description Administracion
 encapsulation dot1Q 30
 ip address 192.168.1.65 255.255.255.240
 bandwidth 100000
 delay 10
 no shutdown
 exit
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Serial2/0
 no passive-interface Serial3/0
 maximum-paths 2
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.4 0.0.0.3 area 0
 network 192.168.0.0 0.0.15.255 area 0
 exit
end
