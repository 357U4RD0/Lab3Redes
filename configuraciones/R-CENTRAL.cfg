hostname R-CENTRAL
no ip domain-lookup
interface Serial2/0
 description Hacia R-OSPF-1
 ip address 10.0.0.5 255.255.255.252
 bandwidth 100000
 ip ospf cost 10
 clock rate 2000000
 no shutdown
 exit
interface Serial3/0
 description Hacia R-OSPF-2
 ip address 10.0.0.9 255.255.255.252
 bandwidth 100000
 ip ospf cost 10
 clock rate 2000000
 no shutdown
 exit
interface Serial6/0
 description Hacia R-EIGRP-1
 ip address 10.0.0.17 255.255.255.252
 bandwidth 100000
 delay 10
 clock rate 2000000
 no shutdown
 exit
interface Serial7/0
 description Hacia R-EIGRP-2
 ip address 10.0.0.21 255.255.255.252
 bandwidth 100000
 delay 10
 clock rate 2000000
 no shutdown
 exit
router ospf 1
 router-id 3.3.3.3
 passive-interface default
 no passive-interface Serial2/0
 no passive-interface Serial3/0
 maximum-paths 2
 network 10.0.0.4 0.0.0.3 area 0
 network 10.0.0.8 0.0.0.3 area 0
 redistribute eigrp 100 metric 20 metric-type 1 subnets
 summary-address 172.16.0.0 255.255.240.0
 exit
router eigrp 100
 no auto-summary
 passive-interface default
 no passive-interface Serial6/0
 no passive-interface Serial7/0
 maximum-paths 2
 network 10.0.0.16 0.0.0.3
 network 10.0.0.20 0.0.0.3
 redistribute ospf 1 metric 100000 1000 255 1 1500
 exit
interface Serial6/0
 ip summary-address eigrp 100 192.168.0.0 255.255.240.0
 exit
interface Serial7/0
 ip summary-address eigrp 100 192.168.0.0 255.255.240.0
 exit
end
