hostname R-EIGRP-2
no ip domain-lookup
interface Serial2/0
 description Hacia R-EIGRP-1
 ip address 10.0.0.14 255.255.255.252
 bandwidth 100000
 delay 100
 no shutdown
 exit
interface Serial3/0
 description Hacia R-CENTRAL
 ip address 10.0.0.22 255.255.255.252
 bandwidth 100000
 delay 510
 no shutdown
 exit
interface FastEthernet0/0
 description Datos
 ip address 172.16.0.1 255.255.255.128
 bandwidth 100000
 delay 10
 no shutdown
 exit
router eigrp 100
 no auto-summary
 passive-interface default
 no passive-interface Serial2/0
 no passive-interface Serial3/0
 maximum-paths 2
 variance 4
 traffic-share balanced
 network 172.16.0.0 0.0.15.255
 network 10.0.0.12 0.0.0.3
 network 10.0.0.20 0.0.0.3
 exit
end
