hostname R-EIGRP-1
no ip domain-lookup
interface Serial2/0
 description Hacia R-EIGRP-2
 ip address 10.0.0.13 255.255.255.252
 bandwidth 100000
 delay 100
 clock rate 2000000
 no shutdown
 exit
interface Serial3/0
 description Hacia R-CENTRAL
 ip address 10.0.0.18 255.255.255.252
 bandwidth 100000
 delay 510
 no shutdown
 exit
interface FastEthernet0/0
 description Trunk 802.1Q hacia SW-EIGRP-1
 no ip address
 no shutdown
 exit
interface FastEthernet0/0.10
 description Datos
 encapsulation dot1Q 10
 ip address 172.16.0.129 255.255.255.192
 bandwidth 100000
 delay 10
 no shutdown
 exit
interface FastEthernet0/0.20
 description Voz
 encapsulation dot1Q 20
 ip address 172.16.0.193 255.255.255.192
 bandwidth 100000
 delay 10
 no shutdown
 exit
router eigrp 100
 no auto-summary
 passive-interface default
 no passive-interface Serial2/0
 no passive-interface Serial3/0
 maximum-paths 2
 variance 4
 traffic-share balanced
 network 172.16.0.0 0.0.15.255
 network 10.0.0.12 0.0.0.3
 network 10.0.0.16 0.0.0.3
 exit
end
